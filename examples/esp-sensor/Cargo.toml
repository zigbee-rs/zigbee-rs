[workspace]

[package]
name = "esp-sensor"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-alloc = { version = "0.10.0" }
esp-backtrace = { version = "0.19.0", features = [
    "panic-handler",
    "println",
	"esp32c6",
] }
# esp32c6 0.23.3 is a breaking patch release (removes `pac::RNG`, adds an
# argument to `i2c_sclk_conf`) and does not compile against esp-hal 1.1.x.
# Pinned until an esp-hal release that matches it. Cargo.lock is gitignored,
# so without this a fresh clone resolves 0.23.3 and fails to build.
esp32c6 = "=0.23.2"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }
esp-hal = { version = "1.1.0", features = ["log-04", "unstable", "esp32c6"] }
esp-println = { version = "0.17.0", features = ["log-04"] }
esp-radio = { version = "1.0.0-beta.0", features = [
    "ieee802154",
    "unstable",
	"esp32c6",
] }
esp-rtos = { version = "0.3.0", features = ["embassy", "log-04", "esp32c6"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-embedded-hal = "0.5.0"
heapless = "0.9.1"
static_cell = "2.1"

# flash access for the zigbee storage feature
esp-storage = { version = "0.9.0", features = ["esp32c6"] }

zigbee = { path = "../../zigbee", features = ["storage"] }
zigbee-types = { version = "0.1.0", path = "../../zigbee-types" }
zigbee-mac = { path = "../../zigbee-mac", features = ["esp32c6"] }
zigbee-base-device-behavior = { path = "../../zigbee-base-device-behavior" }
zigbee-cluster-library = { path = "../../zigbee-cluster-library" }

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
