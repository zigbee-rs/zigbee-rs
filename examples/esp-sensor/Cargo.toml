[workspace]

[package]
name = "esp-sensor"
version = "0.1.0"
edition = "2024"

[features]
esp32c6 = [
    "esp-alloc/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-hal/esp32c6",
    "esp-radio/esp32c6",
    "esp-rtos/esp32c6",
    "esp-storage/esp32c6",
    "zigbee-mac/esp32c6",
]
esp32c5 = [
    "esp-alloc/esp32c5",
    "esp-backtrace/esp32c5",
    "esp-bootloader-esp-idf/esp32c5",
    "esp-hal/esp32c5",
    "esp-radio/esp32c5",
    "esp-rtos/esp32c5",
    "esp-storage/esp32c5",
    "zigbee-mac/esp32c5",
]
esp32h2 = [
    "esp-alloc/esp32h2",
    "esp-backtrace/esp32h2",
    "esp-bootloader-esp-idf/esp32h2",
    "esp-hal/esp32h2",
    "esp-radio/esp32h2",
    "esp-rtos/esp32h2",
    "esp-storage/esp32h2",
    "zigbee-mac/esp32h2",
]

[dependencies]
esp-alloc = { version = "0.11" }
esp-backtrace = { version = "0.20", features = [
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.6" }
esp-hal = { version = "1.2", features = ["log-04", "unstable"] }
esp-println = { version = "0.18", features = ["log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = [
    "ieee802154",
    "unstable",
] }
esp-rtos = { version = "0.4", features = ["embassy", "log-04"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-embedded-hal = "0.6"
heapless = "0.9.1"
static_cell = "2.1"

# flash access for the zigbee storage feature
esp-storage = { version = "0.10", features = ["embedded-storage"] }

zigbee = { path = "../../zigbee", features = ["storage"] }
zigbee-types = { path = "../../zigbee-types" }
zigbee-mac = { path = "../../zigbee-mac" }
zigbee-cluster-library = { path = "../../zigbee-cluster-library" }

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
