[workspace]

[package]
name = "esp-simple-sniffer"
version = "0.1.0"
authors = ["Patrick Willner <50421879+heat1q@users.noreply.github.com>"]
edition = "2024"

[dependencies]
byte = "0.2.7"
esp-backtrace = { version = "0.19.0", features = [
    "esp32c6",
    # "exception-handler",
    "panic-handler",
    "println",
] }
esp-alloc = { version = "0.10.0" }
# esp32c6 0.23.3 is a breaking patch release (removes `pac::RNG`, adds an
# argument to `i2c_sclk_conf`) and does not compile against esp-hal 1.1.x.
# Pinned until an esp-hal release that matches it. Cargo.lock is gitignored,
# so without this a fresh clone resolves 0.23.3 and fails to build.
esp32c6 = "=0.23.2"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }
esp-hal = { version = "1.1.0", features = ["esp32c6", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32c6", "log-04"] }
esp-radio = { version = "1.0.0-beta.0", features = ["ieee802154", "unstable", "esp32c6"] }
hex = { version = "0.4.3", default-features = false }
ieee802154 = "0.6.1"
log = { version = "0.4.21" }
zigbee-core = { path = "../../zigbee-core" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1 
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
