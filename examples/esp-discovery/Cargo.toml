[workspace]

[package]
name = "esp-discovery"
version = "0.1.0"
edition = "2024"

[features]
default = ["esp32c6"]
esp32c6 = [
    "esp-alloc/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-hal/esp32c6",
    "esp-println/esp32c6",
    "esp-radio/esp32c6",
    "esp-rtos/esp32c6",
    "zigbee-mac/esp32c6",
]

[dependencies]
esp-alloc = { version = "0.11" }
esp-backtrace = { version = "0.20", features = [
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.6" }
esp-hal = { version = "1.2", features = ["log-04", "unstable"] }
esp-println = { version = "0.18", features = ["log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = [
    "ieee802154",
    "unstable",
] }
esp-rtos = { version = "0.4", features = ["embassy", "log-04"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
heapless = "0.9.1"

zigbee-core = { path = "../../zigbee-core" }
zigbee-types = { path = "../../zigbee-types" }
zigbee-mac = { path = "../../zigbee-mac" }

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
