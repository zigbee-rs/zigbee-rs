name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1-5'  # run once per day Monday-Friday at 6:00am

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Ccodegen-units=1 -Copt-level=0 -Clink-dead-code -Coverflow-checks=off

permissions:
  contents: write
  pull-requests: write 

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          # - stable
          - nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # - name: Check semver
        # uses: obi1kenobi/cargo-semver-checks-action@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v4
        env:
          cache-name: cache-dependencies
        with:
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-tests-${{ env.cache-name }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --all-features --workspace -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        env:
          CARGO_INCREMENTAL: 0
        run: cargo test --all-features --workspace

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # TODO(#77): switch to stable once the crate builds without nightly
          toolchain: nightly
          components: llvm-tools-preview

      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Cache dependencies
        uses: actions/cache@v4
        env:
          cache-name: cache-dependencies
        with:
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-coverage-${{ env.cache-name }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage
        env:
          CARGO_INCREMENTAL: 0
        run: cargo llvm-cov --all-features --workspace --lcov --output-path ./lcov.info

      - name: remove full path from coverage
        run: sed -i "s;$PWD/;;g" ./lcov.info

      - name: Report code coverage
        uses: zgosalvez/github-actions-report-lcov@v7
        with:
          coverage-files: ./lcov.info
          minimum-coverage: 14
          artifact-name: code-coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          # - stable
          - nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # - name: Check semver
        # uses: obi1kenobi/cargo-semver-checks-action@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-dependencies
        with:
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}

      - name: Run build
        env:
          CARGO_INCREMENTAL: 0
        run: cargo build
