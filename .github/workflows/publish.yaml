name: Publish

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to publish'
        required: true
        type: choice
        options:
          # dependency order: publish top to bottom
          - zigbee-macros
          - zigbee-types
          - zigbee-mac
          - zigbee-core
          - zigbee-cluster-library
          - zigbee-base-device-behavior
          - zigbee
      dry_run:
        description: 'Package and verify without uploading'
        required: false
        default: false
        type: boolean

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: 'true'

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: rust:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # zigbee-mac is excluded from the workspace and carries its own
      # .cargo/config.toml pinning the RISC-V target and build-std, which the
      # verification build honours because cargo is invoked from inside the
      # crate directory
      - name: Install the toolchain zigbee-mac verifies against
        if: inputs.crate == 'zigbee-mac'
        run: |
          rustup component add rust-src
          rustup target add riscv32imac-unknown-none-elf

      # excluded crates are invisible to -p, so publish from inside the directory
      - name: Publish ${{ inputs.crate }}
        working-directory: ${{ inputs.crate == 'zigbee-mac' && 'zigbee-mac' || '.' }}
        run: |
          args=""
          [ "${{ inputs.dry_run }}" = "true" ] && args="--dry-run"
          if [ "${{ inputs.crate }}" = "zigbee-mac" ]; then
            cargo publish $args
          else
            cargo publish -p "${{ inputs.crate }}" $args
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
