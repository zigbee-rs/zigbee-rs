[package]
name = "zigbee"
version.workspace = true

description = "Zigbee protocol stack in `no-std`: the application-facing runtime on top of `zigbee-core`"
documentation = "https://docs.rs/zigbee"
readme = "README.md"
keywords = ["zigbee", "ieee802154", "no-std", "embedded"]
categories = ["network-programming", "no-std", "embedded"]
license = "MIT OR Apache-2.0"

authors.workspace = true
repository.workspace = true
edition.workspace = true

[features]
# persist the information bases to NOR flash; re-exports the flash storage
# driver so an application only depends on this crate
storage = ["zigbee-core/storage"]

[dependencies]
embedded-hal-async.workspace = true
log.workspace = true
zigbee-core.workspace = true
zigbee-cluster-library.workspace = true
zigbee-base-device-behavior.workspace = true
zigbee-mac.workspace = true
zigbee-types.workspace = true

[package.metadata.docs.rs]
all-features = true
